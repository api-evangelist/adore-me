aid: adore-me
name: Adore Me
description: 'Adore Me is a New York City based direct-to-consumer intimate apparel brand
  founded in 2011 by Morgan Hermand-Waiche, selling bras, panties, lingerie sets, sleepwear,
  swimwear, activewear and loungewear across an inclusive size range (bands 30-46, cups
  A-I, apparel XS-4X) through adoreme.com, native iOS and Android apps, and a small
  physical retail footprint. The company built a proprietary e-commerce and merchandising
  platform rather than buying a hosted storefront, and is known for the Elite Box home
  try-on program, an annual Premier membership, and published environmental, social and
  governance impact reporting. Victoria''s Secret & Co. acquired Adore Me for $400 million
  in cash, signing on 1 November 2022 and closing on 3 January 2023; Adore Me continues to
  operate as its own brand and its technology is being used to modernize the VS&Co digital
  platform. Adore Me operates no public developer program: it publishes no developer portal,
  no API reference, and no machine-readable API contract of any kind. Its storefront JSON
  backend under /api/ is an undocumented internal surface that rejects every unauthenticated
  request with a validation error. The public technical surface enrichment could verify is a
  well-formed provider-authored llms.txt covering the whole catalog, mobile app-association
  documents at /.well-known/, an Atlassian Statuspage, and a Bugcrowd vulnerability
  disclosure program.'
